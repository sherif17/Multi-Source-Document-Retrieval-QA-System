services:
  - type: web
    name: doc-retrieval-qa
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: PINECONE_INDEX_NAME
        value: doc-retrieval
